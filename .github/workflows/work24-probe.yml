name: 고용24 API 점검

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: API 호출
        env:
          WORK24_AUTH_KEY: ${{ secrets.WORK24_AUTH_KEY }}
        run: python scripts/work24_probe.py
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/work24_probe
          git diff --cached --quiet || git commit -m "고용24 API 점검 결과 저장"
          git push
