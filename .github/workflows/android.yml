name: 안드로이드 앱 빌드

# android 폴더가 바뀌면 자동으로 APK를 만들고, '안드로이드 앱' 릴리스에 올린다.
# 서명 키는 저장소에 없고, Secrets(ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD)에서 꺼내 쓴다.
# Secrets가 없으면 임시 키로 시험용 APK를 만든다(나중에 정식 키 APK로 바꾸려면 앱을 지우고 다시 설치해야 함).
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 서명 키 준비
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::서명 키 Secrets가 없어 임시 키로 시험용 APK를 만듭니다."
          fi

      - name: APK 빌드 (정식 키)
        if: steps.key.outputs.signed == 'true'
        run: |
          gradle -p android assembleRelease --no-daemon --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk esg-career-map.apk

      - name: APK 빌드 (시험용 임시 키)
        if: steps.key.outputs.signed != 'true'
        run: |
          gradle -p android assembleDebug --no-daemon --stacktrace
          cp android/app/build/outputs/apk/debug/app-debug.apk esg-career-map.apk

      - name: 서명 키 파일 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 안드로이드 앱 (최신)
          make_latest: true
          body: |
            ESG 커리어 맵 안드로이드 앱입니다. 휴대폰에서 아래 esg-career-map.apk를 눌러 내려받아 설치하세요.
            ${{ steps.key.outputs.signed == 'true' && '정식 서명 키로 서명한 APK입니다.' || '시험용 APK(임시 키)입니다. 정식 키 APK로 바꿀 때는 앱을 지우고 다시 설치해야 합니다.' }}
            빌드 ${{ github.run_number }} · ${{ github.sha }}
          files: esg-career-map.apk
